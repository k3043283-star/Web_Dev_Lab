
<!DOCTYPE html>
<html>
<head>
    <title>Flexbox vs Grid</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
        }

        header {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 20px;
        }

       
        .navbar {
            display: flex;
            justify-content: space-around;
            background-color: lightblue;
            padding: 15px;
        }

        .navbar a {
            text-decoration: none;
            color: black;
        }

        
        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            padding: 20px;
        }

        .card {
            background-color: lightgray;
            padding: 30px;
            text-align: center;
        }

        footer {
            background-color: navy;
            color: white;
            text-align: center;
            padding: 15px;
        }

       
        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }

            .navbar {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>My Portfolio</h1>
    </header>

    
    <nav class="navbar">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Skills</a>
        <a href="#">Contact</a>
    </nav>

   
    <main class="container">

        <div class="card">
            <h2>HTML</h2>
            <p>Web Structure</p>
        </div>

        <div class="card">
            <h2>CSS</h2>
            <p>Web Design</p>
        </div>

        <div class="card">
            <h2>Java</h2>
            <p>Web Development</p>
        </div>

    </main>

    <footer>
        <p>My Portfolio 2026</p>
    </footer>

</body>
</html>
