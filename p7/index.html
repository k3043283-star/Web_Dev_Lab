
<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        
        :root {
            --primary-color: blue;
            --secondary-color: lightgray;
            --text-color: black;
            --background-color: white;
            --space: 20px;
        }

        
        body {
            font-family: Arial, sans-serif;
            font-size: 16px;
            color: var(--text-color);
            background-color: var(--background-color);
            margin: 0;
        }

        h1 {
            font-size: 32px;
            color: var(--primary-color);
        }

        h2 {
            font-size: 24px;
        }

        p {
            font-size: 16px;
            line-height: 1.5;
        }

        
        header {
            background-color: var(--secondary-color);
            padding: var(--space);
            text-align: center;
        }

        
        nav a {
            text-decoration: none;
            color: var(--primary-color);
            margin: 10px;
        }

        
        section {
            padding: var(--space);
        }

        
        footer {
            background-color: var(--secondary-color);
            text-align: center;
            padding: var(--space);
        }
    </style>
</head>

<body>

    <header>
        <h1>My Portfolio</h1>
        <p>Welcome to my website</p>

        <nav>
            <a href="#home">Home</a>
            <a href="#about">About</a>
            <a href="#skills">Skills</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <main>
        <section id="home">
            <h2>Home</h2>
            <p>Hello! I am a web developer.</p>
        </section>

        <section id="about">
            <h2>About Me</h2>
            <p>I love learning HTML and CSS.</p>
        </section>

        <section id="skills">
            <h2>My Skills</h2>
            <p>HTML, CSS and Java</p>
        </section>

        <section id="contact">
            <h2>Contact Me</h2>
            <p>Email: khushboo@gmail.com</p>
        </section>
    </main>

    <footer>
        <p>Copyright 2026 My Portfolio</p>
    </footer>

</body>
</html>
