
<!DOCTYPE html>
<html>
<head>
    <title>My Portfolio</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: lightgray;
        }

       
        header {
            background-color: navy;
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        header h1 {
            margin: 0;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        
        .profile {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 40px;
            flex-wrap: wrap;
        }

        .profile img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
        }

        .info {
            max-width: 400px;
        }

        
        .skills {
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .card {
            background-color: white;
            padding: 25px;
            width: 180px;
            text-align: center;
            border-radius: 10px;
        }

        
        @media (max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .profile {
                flex-direction: column;
                text-align: center;
            }

            .skills {
                flex-direction: column;
            }
        }

    </style>
</head>

<body>

    
    <header>
        <h1>My Portfolio</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Skills</a>
            <a href="#">Projects</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    
    <section class="profile">

        <img src="images.jpeg"
             alt="Profile photo">

        <div class="info">
            <h2>Hello, I am Khushboo</h2>
            <h3>Web Developer</h3>
            <p>
                I am learning HTML, CSS and Java.
                I love creating simple websites.
            </p>
        </div>

    </section>

    
    <h2 style="text-align:center;">My Skills</h2>

    <section class="skills">

        <div class="card">
            <h3>HTML</h3>
            <p>Web Structure</p>
        </div>

        <div class="card">
            <h3>CSS</h3>
            <p>Web Design</p>
        </div>

        <div class="card">
            <h3>Java</h3>
            <p>Web Development</p>
        </div>

    </section>

    
    <footer style="text-align:center; padding:20px;">
        <p>© 2026 My Portfolio</p>
    </footer>

</body>
</html>
