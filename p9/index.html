
<!DOCTYPE html>
<html>
<head>
    <title>Responsive Navbar and Cards</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: lightgray;
        }

       
        nav {
            background-color: blue;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        
        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            padding: 30px;
        }

        .card {
            background-color: white;
            width: 250px;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
        }

        .card img {
            width: 100%;
            border-radius: 10px;
        }

        
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
            }

            .container {
                flex-direction: column;
                align-items: center;
            }

            .card {
                width: 80%;
            }
        }
    </style>
</head>

<body>

    
    <nav>
        <h2 style="color:white;">My Website</h2>

        <div>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>
    </nav>

    
    <div class="container">

        <div class="card">
            <img src="image1.jpeg" alt="Web design">
            <h2>Web Design</h2>
            <p>Learn HTML and CSS.</p>
        </div>

        <div class="card">
            <img src="image2.jpeg" alt="Development">
            <h2>Development</h2>
            <p>Create beautiful websites.</p>
        </div>

        <div class="card">
            <img src="image3.jpeg" alt="Programming">
            <h2>Programming</h2>
            <p>Learn coding skills.</p>
        </div>

    </div>

</body>
</html>
